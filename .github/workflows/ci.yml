name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The deterministic lane: no model, login or network beyond installing the pinned tools. The layers that drive the
  # real grok, pi and opencode binaries stay in scripts/check.sh, run locally; see AGENTS.md "What belongs where".
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    env:
      # Bun and node match the toolchain base/test-baseline.tsv was recorded with, because check-base.sh compares
      # upstream's own suite counts. The claude CLI is pinned so a new validator rule cannot fail CI without a repo change.
      BUN_VERSION: 1.3.10
      NODE_VERSION: 26.12.1
      CLAUDE_CODE_VERSION: 2.1.308

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Entry files match the generator
        run: node scripts/sync-manifests.mjs --check

      - name: pstack/ is upstream bytes and upstream suites keep their counts
        run: scripts/check-base.sh

      - name: Cursor catalog passes upstream's validator
        run: scripts/check-catalog.sh

      - name: Cache claude-code validator
        id: cache-claude-code
        uses: actions/cache@v6
        with:
          path: ~/.npm-global
          key: claude-code-${{ runner.os }}-${{ env.CLAUDE_CODE_VERSION }}

      - name: Install claude-code validator
        if: steps.cache-claude-code.outputs.cache-hit != 'true'
        run: npm install -g --prefix ~/.npm-global @anthropic-ai/claude-code@${{ env.CLAUDE_CODE_VERSION }}

      - name: Claude manifests pass validate --strict
        run: |
          export PATH="$HOME/.npm-global/bin:$PATH"
          claude --version
          claude plugin validate --strict .claude-plugin/marketplace.json
          claude plugin validate --strict .claude-plugin/plugin.json

      - name: Unit tests
        run: bun run test
